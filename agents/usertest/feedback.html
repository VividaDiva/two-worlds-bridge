<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bridge · Visual feedback</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f2;color:#233d36;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}header,.row,nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:25px;margin:0}p{line-height:1.5}button,select,a{font:inherit}button,select,.link{padding:10px 16px;border:1px solid #b9c7bf;border-radius:9px;background:white;color:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}button[aria-pressed=true],button.active{outline:3px solid #274c43;outline-offset:2px}.primary{background:#274c43;color:white}nav{margin:24px 0}nav button{flex:1}section{background:white;padding:20px;border-radius:16px}canvas{display:block;width:100%;height:auto!important;touch-action:none;background:#eee8dc;border-radius:8px;margin:16px 0}small,#context{color:#62736d}.swatch{border-left:20px solid var(--color)}textarea{width:100%;min-height:70px;font:inherit;padding:12px;border:1px solid #b9c7bf;border-radius:8px;margin:16px 0}#status{min-height:24px}#records{margin-top:24px}article{padding:15px;background:white;border:1px solid #d5ded8;border-radius:10px;margin:10px 0}article img{width:32%;vertical-align:top}#workspace[hidden]{display:none}.muted{font-size:14px;color:#62736d}a{color:#274c43}
</style><main><header><div><h1>What would you change?</h1><p id="context">Loading the saved bridge…</p></div><a id="back">Back to session</a></header>
<div class="row"><label>Feedback from <select id="role"><option value="A">Role 1</option><option value="B">Role 2</option></select></label><span class="muted">Your original results stay unchanged. Save a separate record for each person.</span></div>
<nav aria-label="Feedback steps"><button data-step="0">1 · Rate matchsticks</button><button data-step="1">2 · Rebuild in blue</button><button data-step="2">3 · Color the sketch</button></nav>
<section id="workspace" hidden><h2 id="title"></h2><p id="instruction"></p><div class="row" id="palette"></div><div class="row" id="tools" style="margin-top:14px"></div><canvas id="canvas" width="1200" height="700" aria-label="Bridge feedback drawing area"></canvas><p id="counts" class="muted"></p><textarea id="note" placeholder="What does this change mean? What is hard to judge? (optional)"></textarea><div class="row"><button id="undo">Undo this step</button><button id="next">Next step →</button><button id="save" class="primary">Save feedback & images</button><button id="download">Download current image</button></div></section>
<p id="status" role="status" aria-live="polite"></p><div id="records"><h2>Saved feedback</h2><div id="record-list"></div></div></main><script src="/draw.js"></script><script src="/feedback.js"></script></html>
