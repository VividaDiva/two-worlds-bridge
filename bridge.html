async function openStudy(){const status=document.getElementById('status'),retry=document.getElementById('retry');retry.hidden=true;try{const r=await fetch('live.json?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error();const data=await r.json(),url=new URL(data.url);if(url.protocol!=='https:'||!url.hostname.endsWith('.trycloudflare.com'))throw Error();location.replace(new URL('/j/0uxtt/both',url));}catch{status.textContent='The study connection is unavailable. Ask the facilitator to check the server, then try again.';retry.hidden=false;}}document.getElementById('retry').onclick=openStudy;openStudy();</script></html>
