// The wall, for the facilitator and for history: cards by theme, each with
// whose it is, how it reached the builder, the words, the need, the reason or
// the labelled guess, the keys, and whether what stands meets it.
const VIA = { direct: ["said to it", ""], "reported-by-A": ["reported by Role 1", "rep"], "reported-by-B": ["reported by Role 2", "rep"], inferred: ["the AI's inference", "inf"] };
const METL = { unverified:"not yet verified", "accepted-proposal":"proposal accepted by both", met: "met", partial: "partly met", no: "not met", unsupported: "no part for it", proposed: "on the sheet — awaiting both", "met-by-rule": "met by a rule", "met-by-new": "met by a new part" };
const KINDL = { rule: "a rule", new: "a new part" };
function wallCard(c, small){
  const [vl, vc] = VIA[c.via] || [c.via, ""];
  return `<div class="wcard ${c.who === "A" ? "ra" : "rb"}${c.withdrawn ? " gone" : ""}">
    <p class="top"><span class="who" style="margin:0">${esc(roleName(c.who))}</span><span class="via ${vc}">${esc(vl)}</span>${
      c.withdrawn ? `<span class="met open">withdrawn</span>` : c.met ? `<span class="met ${c.met}">${METL[c.met] || c.met}</span>` : `<span class="met open">open</span>`}</p>
    ${small ? "" : `<q>${esc(c.quote)}</q>`}
    <p class="need">${esc(c.need)}</p>
    ${c.why ? `<p class="why${/^hypothesis/i.test(c.why) ? " hyp" : ""}">${esc(c.why)}</p>` : ""}
    ${small ? "" : `<div class="keys">${c.keys.map(k => `<span class="key">${esc(k)}</span>`).join("")}${c.rulesOut.map(k => `<span class="key">not: ${esc(k)}</span>`).join("")}${!c.keys.length && !c.rulesOut.length ? `<span class="key none">no key carries it</span>` : ""}</div>`}
    ${c.concern ? `<p class="extra"><b>concern</b>${esc(c.concern)}</p>` : ""}
    ${c.when ? `<p class="extra"><b>when</b>${esc(c.when)}</p>` : ""}
    ${c.readings && c.readings.length ? `<p class="extra"><b>readings</b>${c.readings.map(esc).join(" · ")}</p>` : ""}
    ${c.hmw ? `<p class="extra"><b>how might we</b>${esc(c.hmw)}</p>` : ""}
    ${!small && c.story ? `<p class="extra"><b>job story</b>${esc(c.story)}</p>` : ""}
    ${!small && c.changes && c.changes.length ? `<p class="extra"><b>later</b>${c.changes.map(x => esc(x.change)).join(" · ")}</p>` : ""}
  </div>`;
}
function wallCards(w, small){
  const themes = [...new Set(w.cards.map(c => c.theme || "other"))];
  const row = c => {
    const [vl, vc] = VIA[c.via] || [c.via, ""];
    const met = c.withdrawn ? `<span class="met open">withdrawn</span>` : c.met ? `<span class="met ${c.met}">${METL[c.met] || c.met}</span>` : `<span class="met open">open</span>`;
    return `<details class="wrow ${c.who === "A" ? "ra" : "rb"}${c.withdrawn ? " gone" : ""}"><summary><i></i><b>${esc(c.need)}<small>${esc(roleName(c.who))} · ${esc(vl)}${c.why ? " · " + esc(c.why.replace(/^hypothesis:\s*/i, "maybe: ")) : ""}</small></b>${met}</summary>
      <div class="body"><q>${esc(c.quote)}</q>
        ${w.kind === "toolkit" ? `<p><b>Evaluation</b>Needs remain unverified until checked against the work with participants.</p>` : c.keys.length || c.rulesOut.length ? `<p><b>checked against</b>${c.keys.map(k => FEATURES_TEXT[k] || k).join("; ")}${c.rulesOut.length ? " · not: " + c.rulesOut.map(k => FEATURES_TEXT[k] || k).join("; ") : ""}</p>` : `<p><b>checked against</b>nothing in the kit carries this</p>`}
        ${c.concern ? `<p><b>concern</b>${esc(c.concern)}</p>` : ""}${c.when ? `<p><b>when</b>${esc(c.when)}</p>` : ""}
        ${c.readings && c.readings.length ? `<p><b>readings</b>${c.readings.map(esc).join(" · ")}</p>` : ""}${c.hmw ? `<p><b>how might we</b>${esc(c.hmw)}</p>` : ""}
        ${c.story ? `<p><b>job story</b>${esc(c.story)}</p>` : ""}${c.checked ? `<p><b>checked by</b>${esc(roleName(c.checked.by))} (${esc(c.checked.how)})</p>` : ""}
        ${c.changes && c.changes.length ? `<p><b>later</b>${c.changes.map(x => esc(x.change)).join(" · ")}</p>` : ""}</div></details>`;
  };
  return themes.map(t => `<div class="wtheme"><h3>${esc(t)}</h3>${w.cards.filter(c => (c.theme || "other") === t).map(row).join("")}</div>`).join("");

// the keys' plain-language glosses, for the "checked against" line
const FEATURES_TEXT = { water:"the ground between us is water", rock:"the ground between us is a drop in rock", minimal:"as little built as possible",
  low:"level with where we stand", open:"nothing closing it in", light:"holds one person only", heavy:"takes loads and carts", guarded:"something at the hand",
  steady:"does not move underfoot", exposed:"nothing at hand over the drop", sways:"moves in the wind", inGap:"something stands in the gap", high:"raised above where we stand",
  many:"a great deal of material", grip:"does not go slick when wet", footed:"ends hold when banks go soft", sheltered:"weather kept off" };
function wallPanel(h){

      ${rec.conflicts.length ? `<p style="margin:8px 0 0"><b>Conflicts:</b> ${rec.conflicts.map(c => `${esc(byId[c.a]?.need || c.a)} × ${esc(byId[c.b]?.need || c.b)} — ${esc(c.note)}`).join("; ")}</p>` : `<p class="muted" style="margin:8px 0 0">No conflicts — different needs are not conflicts.</p>`}
      ${rec.checks ? `<p class="chk">${Object.entries(rec.checks).map(([k, v]) => `<span class="${v ? "y" : "n"}">${v ? "✓" : "✗"} ${esc(k)}</span>`).join(" · ")}</p>` : ""}</div>` : ""}

// The agent's trace. An agentic interface shows the work, not just the reply:
// for each thing said to it, what it READ out of that line, and then what it
// DID about it. The gap between those two is the whole subject.
// Legacy records retain their original readings even when mode metadata is absent.
function savedKeyReading(l){
  const r=l.interpretations?.filter(x=>x.kind === "keys").at(-1);
  const recorded=!!r || Array.isArray(l.taken) || Array.isArray(l.asks) || Array.isArray(l.picture);
  return {recorded,asks:r?.asks || [...new Set([...(l.asks || l.taken || []),...(l.picture || [])])],refuses:r?.refuses || l.refuses || [],beyond:r?.beyond || l.beyond || ""};
}
function keyReadingHtml(l){
  const r=savedKeyReading(l);
  if(!r.recorded) return `<p class="muted">No AI reading saved for this contribution. It may not have reached the AI on this path.</p>`;
  const chips=(keys,negative=false)=>keys.map(k=>`<span class="key">${negative ? 'Not: ' : ''}${esc(k)}${FEATURES_TEXT[k] ? ` · ${esc(FEATURES_TEXT[k])}` : ''}</span>`).join('');
  return `<p><strong>Heard as</strong>${chips(r.asks) || '<span class="muted">No matching key</span>'}</p>${r.refuses.length ? `<p><strong>Ruled out</strong>${chips(r.refuses,true)}</p>` : ''}${r.beyond ? `<p><strong>Could not represent</strong>${esc(r.beyond)}</p>` : ''}`;
}
function controlReadingPanel(h){
  const humans=(h.lines || []).filter(l=>l.who === 'A' || l.who === 'B');
  const latest=[...humans].reverse().find(l=>savedKeyReading(l).recorded);
  return `<section class="card control-reading"><h2>What the AI heard · Control</h2>${h.agent !== 'keys' ? '<p class="tk-caption">Original saved key readings. This older session did not record its processing mode.</p>' : '<p class="tk-caption">Control translates contributions into building keys.</p>'}${latest ? `<article class="tk-reading latest-heard"><h3>Last recorded interpretation · ${esc(roleName(latest.who))}</h3><blockquote>${esc(latest.text)}</blockquote>${keyReadingHtml(latest)}<p class="tk-caption">This is the last recorded contribution, not a reconstruction of the AI’s full context.</p></article>` : '<p class="muted">No key interpretation recorded yet.</p>'}<details class="every" data-fold="control-readings"><summary>Every contribution · what reached the AI</summary>${humans.map(l=>`<article class="tk-reading"><b>${esc(roleName(l.who))}</b><blockquote>${esc(l.text)}</blockquote>${keyReadingHtml(l)}</article>`).join('')}</details>${h.standing ? `<div class="build-destination"><small>WHAT IT BUILT</small><p>${esc(h.standing)}</p></div>` : ''}</section>`;
}
function builderColumn(h){
  if (h.agent === "keys" || (!h.wall && !h.control && h.agent !== "toolkit")) return controlReadingPanel(h);

  const tabs = h.control ? `<div class="tabs" role="tablist">
      <button class="tab" role="tab" data-atab="toolkit" aria-selected="${agentTab === "toolkit"}">Toolkit<small>understanding, methods & reasons</small></button>
      <button class="tab" role="tab" data-atab="control" aria-selected="${agentTab === "control"}">Control<small>keys only, built beside it</small></button>
    </div>` : "";
  if (h.control && agentTab === "control") return controlColumn(h, tabs);
  const acts = [];
  // Only what reached the builder, or was kept from it by the route. Talk between
  // the two of them on the open routes is theirs, and would bury the trace. The
  // builder's answer is the next builder line — the two may go on talking while
  // it works, so it is not always the very next line.
  h.lines.forEach((l, i) => {
    if (l.who === "builder" || (h.open && l.phase === "confer")) return;
    let did = null;
    for (let k = i + 1; k < h.lines.length; k++) {
      const n = h.lines[k];
      if (n.who === "builder") { did = n; break; }
      if (n.phase !== "confer") break;
    }
    // On a route that builds once at the end, a line it read but did not answer
    // was held, not withheld. It used to say "never given to it" here.
    acts.push({ said: l, did, held: !did && h.defer && !!l.taken, heard: !did && l.talk && !!l.taken });
  });
  const body = !acts.length
    ? `<p class="muted">${h.open ? "Nothing yet. It answers when one of them confirms a decision."
                                 : "Nothing yet. It answers once somebody has spoken to it."}</p>`
    : acts.map(a => `
      <div class="act${a.did ? "" : " none"} ${a.said.who === "A" ? "fa" : "fb"}">
        <span class="stamp">${esc(roleName(a.said.who))} ${a.said.upload ? "showed" : a.said.decision ? "confirmed" : "said"}</span>
        <p class="quote">${a.said.upload ? "their drawing" : esc(a.said.text.slice(0, 120)) + (a.said.text.length > 120 ? "…" : "")}</p>
        ${a.said.cards && h.wall ? (() => { const cs = h.wall.cards.filter(c => a.said.cards.includes(c.id)); return cs.length
            ? `<div class="needs" style="margin:0 0 7px">${cs.map(c => `<span class="needchip ${c.who === "A" ? "ra" : "rb"}${c.withdrawn ? " dim" : ""}"><i></i>${esc(c.need)}</span>`).join("")}</div>`
            : `<p class="read"><span class="lbl">heard as</span><span class="key none">no need — an answer, or already on the wall</span></p>`; })()
          : a.said.taken && a.said.taken.length
          ? `<p class="read"><span class="lbl">interpreted as</span>${[...(a.said.asks || a.said.taken), ...(a.said.refuses || []).map(k => "not: " + k)].map(k =>
               `<span class="key">${esc(k)}</span>`).join("")}</p>`
          : a.said.taken || a.did ? `<p class="read"><span class="lbl">interpreted as</span><span class="key none">nothing it could build from</span></p>` : ""}
        ${a.said.beyond ? `<p class="read"><span class="lbl">couldn't carry</span><span class="key none">${esc(a.said.beyond)}</span></p>` : ""}
        ${a.said.tools?.length ? `<div class="tk-history-tools">${toolkitTools(a.said.tools)}</div>` : ""}
        ${a.said.ask ? `<p class="asked">asked ${esc(roleName(a.said.who))}: ${esc(a.said.ask)}</p>` : ""}
        ${a.said.picture && a.said.picture.length
          ? `<p class="read"><span class="lbl">saw in their picture</span>${a.said.picture.map(k =>
               `<span class="key">${esc(k)}</span>`).join("")}</p>` : ""}
        ${a.did
          ? (a.did.failed
              ? `<p class="move muted">${esc(failNote(a.did, true))}</p>
                 ${a.did.built ? `<span class="made">→ ${esc(a.did.built)}</span>` : ""}`
              : a.did.relay
                ? `<p class="move"><span class="relayto">told ${esc(roleName(a.did.about === "A" ? "B" : "A"))}</span>${esc(a.did.text)}</p>`
                : `<p class="move">${esc(a.did.text)}</p>
                 ${a.did.built ? `<span class="made">→ ${esc(a.did.built)}</span>` : ""}
`)
          : a.held ? `<p class="move muted">Held — it builds once, after both of them have spoken.</p>`
          : a.heard ? `<p class="move muted">Heard — it builds when one of them confirms a decision.</p>`
          : `<p class="move muted">${a.said.phase === "confer"
               ? "Not heard — they were talking to each other."
               : "This line was never given to it."}</p>`}
      </div>`).join("");
  return `<div class="card tab mach did">
    <h2>What the agent did</h2>
    ${tabs}
    ${understandingBoard(h)}
    <details class="every" data-fold="latest-reading"><summary>Latest contribution · methods and evidence</summary>${processRail(h)}</details>
    <details class="every" data-fold="full-wall"><summary>Full need-card details</summary>${wallInside(h)}</details>
    <details class="every"><summary>Every line, in order</summary>${body}</details>
    ${h.thinking ? `<p class="muted" style="margin-top:10px">Deciding…</p>` : ""}</div>`;
}

// The toolkit's last turn as five steps on a rail: what it heard, which tools
// fired, what it decided, what it built, and how each need came out.
function toolkitLineReading(s,l){
  if(l.interpretations?.length) return readingVersions(l);
  const cards = (s.wall?.cards || []).filter(c=>(l.cards || []).includes(c.id));
  return `<div class="tk-inline">${cards.map(c=>`<p><b>AI understood · ${esc(roleName(c.who))}</b>${esc(c.need)}</p>${c.why ? `<p><b>${/^hypothesis/i.test(c.why) ? "Unconfirmed hypothesis" : "Recorded reason"}</b>${esc(c.why)}</p>` : ""}${c.readings?.length ? `<p><b>Possible meanings</b>${c.readings.map(esc).join(" / ")}</p>` : ""}`).join("") || `<p>No new need card recorded.</p>`}<b class="tk-inline-label">Toolkit methods</b>${l.tools?.length ? l.tools.map(t=>`<p><b>${esc(TOOLKIT_LABELS[t.tool]?.[0] || t.tool)}${t.facilitatorRun ? " · suggested, not run" : " · reported by AI"}</b>${esc(t.why || "No reason recorded.")}</p>`).join("") : `<p>No method recorded.</p>`}${l.ask ? `<p><b>Question recorded</b>${esc(l.ask)}</p>` : ""}<small>AI interpretation, not participant confirmation. Historical snapshot unavailable. Cards show the current saved record, not necessarily what the AI understood at that time.</small></div>`;
}

const TOOLKIT_LABELS = {

  "three-readings": ["Three readings", "Keep alternative meanings open until the speaker clarifies."],
  empathy: ["Empathy", "Keep the person's hesitation or concern visible."],
  journey: ["Journey", "Understand when and in what situation the need matters."],
  hmw: ["How might we", "Frame a need the current building kit cannot yet support."],
  "job-story": ["Job story", "Express the situation, intention and outcome for the other person."],
  "dot-voting": ["Dot voting", "Invite people to prioritize when a verified constraint prevents meeting every need."],
  "priority-check": ["Priority check", "Ask which needs are essential and which are optional."],
  "card-sort": ["Card sort", "Ask participants how they group the needs."],
  "repertory-grid": ["Repertory grid", "Invite participants to compare the qualities that matter to them."],
  "wizard-of-oz": ["Wizard of Oz", "Have a facilitator simulate an interaction for participants to try."]
};
function toolkitTools(items){
  if (!items?.length) return `<p class="tk-empty">No toolkit method was recorded for this contribution.</p>`;
  return items.map(t => {
    const [name, purpose] = TOOLKIT_LABELS[t.tool] || [t.tool, ""];
    return `<article class="tk-tool"><div class="tk-tool-head"><b>${esc(name)}</b><span class="tk-status${t.facilitatorRun ? " suggested" : ""}">${t.facilitatorRun ? "Suggested · not run by AI" : "Reported by AI"}</span></div>
      ${purpose ? `<p class="tk-purpose">${esc(purpose)}</p>` : ""}
      <p><strong>Why this method</strong>${t.why ? esc(t.why) : "No reason was recorded."}</p>
      ${t.facilitatorRun ? `<p class="tk-empty">Requires a facilitator. No participant outcome is implied.</p>` : ""}</article>`;
  }).join("");
}
function processRail(h){
  const lines = h.lines || [];
  // A newer unprocessed contribution must not be presented as an older reading.
  const human = [...lines].reverse().find(l => l.who === "A" || l.who === "B");
  const line = [...lines].reverse().find(l => (l.who === "A" || l.who === "B") && Array.isArray(l.cards));
  if (!line) return `<div class="tk-empty">${human ? "No Toolkit interpretation has been recorded yet for this conversation." : "Once someone contributes, this panel will show what the AI understood and which toolkit methods it reported using."}</div>`;
  const snapshot = line.interpretations?.at(-1);
  const allCards = snapshot?.cards || h.wall?.cards || [];
  const cards = snapshot ? allCards : allCards.filter(c => line.cards.includes(c.id));
  const reading = cards.map(c => `<article class="tk-reading"><div class="tk-tool-head"><b>${esc(roleName(c.who))}</b><span class="tk-status">${esc((VIA[c.via] || [c.via || "source not recorded"])[0])}${c.withdrawn ? " · withdrawn" : ""}</span></div>
    <blockquote>${c.quote ? esc(c.quote) : "No source quotation recorded."}</blockquote><p><strong>AI understood</strong>${esc(c.need)}</p>
    ${c.why ? `<p><strong>${/^hypothesis/i.test(c.why) ? "AI hypothesis · unconfirmed" : "Recorded reason"}</strong>${esc(c.why)}</p>` : ""}
    ${[["Concern",c.concern],["When it matters",c.when],["Possible readings",(c.readings || []).join(" / ")],["How might we",c.hmw],["Job story",c.story]].filter(([,v])=>v).map(([k,v])=>`<p><strong>${k}</strong>${esc(v)}</p>`).join("")}
    </article>`).join("");
  return `<div class="tk-inspect"><div class="tk-source"><p class="eyebrow">Latest recorded interpretation · ${esc(roleName(line.who))}</p><q>${esc(line.upload ? "Participant submitted a drawing." : line.text || "No text recorded.")}</q>${human !== line ? `<p class="tk-empty">A newer contribution has no recorded Toolkit reading yet. This panel still refers to the contribution quoted above.</p>` : ""}</div>
    <div class="tk-grid"><section><h3>01 &nbsp; What the AI understood</h3>${reading || `<p class="tk-empty">No new need card was recorded. This may be an acknowledgement or an update to an existing need; see the full record below.</p>`}<p class="tk-caption">${snapshot ? "Saved interpretation at this step." : "Historical snapshot unavailable; cards reflect the current saved record."} This is the AI's interpretation, not confirmation from either person.</p></section>
    <section><h3>02 &nbsp; Which toolkit methods it used</h3>${toolkitTools(line.tools)}${line.ask ? `<div class="tk-question"><strong>Question recorded</strong><p>${esc(line.ask)}</p></div>` : ""}${line.memberCheck ? `<p class="tk-caption">Correction opportunity: ${esc(line.memberCheck)}</p>` : ""}<p class="tk-caption">Methods are reported by the AI in its response; this is not an independent execution log.</p></section></div></div>`;
}

// Saved public interpretations and decisions, never an internal reasoning transcript.
function readingSnapshot(r){
  if(r.kind === "keys") return `<div class="tk-inline"><p><b>Matched keys</b>${(r.asks || []).map(esc).join(", ") || "None"}</p><p><b>Excluded keys</b>${(r.refuses || []).map(esc).join(", ") || "None"}</p>${r.beyond ? `<p><b>Not represented</b>${esc(r.beyond)}</p>` : ""}</div>`;
  return `<div class="tk-inline">${r.observation ? `<p><b>Visual observation · not confirmed intention</b>${esc(r.observation)}</p>` : ""}${(r.cards || []).map(c=>`<article class="tk-reading"><b>${esc(roleName(c.who))} · ${esc(c.id)}</b><blockquote>${esc(c.quote || r.source)}</blockquote><p><strong>AI understood${c.withdrawn ? " · withdrawn" : ""}</strong>${esc(c.need)}</p>${c.why ? `<p><strong>Reason / hypothesis · not confirmed</strong>${esc(c.why)}</p>` : ""}${c.readings?.length ? `<p><strong>Possible meanings</strong>${c.readings.map(esc).join(" / ")}</p>` : ""}</article>`).join("") || `<p>No new need in this reading.</p>`}${toolkitTools(r.tools)}${(r.updates || []).map(u=>`<p>${u.status === "pending" ? "Pending · not applied" : u.status === "applied" ? "Applied revision" : "Recorded update"} · ${esc(u.id)}: ${esc(u.change)}</p>`).join("")}${r.ask ? `<p><b>Question recorded</b>${esc(r.ask)}</p>` : ""}</div>`;
}
function readingVersions(l){
  return [...l.interpretations].reverse().map((r,i)=>`<${i ? 'details' : 'div'} class="reading-version">${i ? `<summary>Earlier reading · version ${esc(r.version)}</summary>` : `<p class="tk-caption">Saved at this step · version ${esc(r.version)}</p>`}<blockquote>${esc(r.source)}</blockquote>${readingSnapshot(r)}</${i ? 'details' : 'div'}>`).join("") + `<p class="tk-caption">Saved AI interpretation, not participant confirmation.${l.interpretations.at(-1)?.kind === "toolkit" ? " Methods are reported by the model." : ""}</p>`;
}
function inlineInterpretation(s,l){
  if(l.who === "builder") return l.decisionSnapshot ? `<details class="trace-fold" data-fold="decision-${s.role}-${l.i}"><summary>What the AI decided for this build</summary>${decisionDiagram(l.decisionSnapshot)}</details>` : "";
  const body=l.interpretations?.length ? readingVersions(l) : s.agent !== "keys" && l.cards ? toolkitLineReading(s,l) : `<p class="tk-caption">No step snapshot recorded. ${l.phase === "confer" ? "This discussion was not sent to the AI." : "This may be an older record or a contribution awaiting interpretation."}</p>`;
  return `<details class="trace-fold" data-fold="reading-${s.role}-${l.i}"><summary>How the AI understood this</summary>${body}<p class="tk-caption">If this misses your meaning, clarify in your next message.</p></details>`;
}
function decisionDiagram(d){
  const cards=d.cards || [], rec=d.record;
  return `<div class="decision-map">${rec?.decisions?.map(x=>`<article class="decision-link"><div><small>NEED · ${esc(x.id)}</small><p>${esc(cards.find(c=>c.id===x.id)?.need || x.id)}</p></div><span aria-hidden="true">→</span><div><small>AI RESPONSE · ${esc(x.response)}</small><p>${esc(x.what)}</p>${x.uncertainty ? `<p class="tk-caption">Uncertain: ${esc(x.uncertainty)}</p>` : ""}</div></article>`).join("") || `<p class="tk-empty">No per-need decision was recorded.</p>`}${rec?.conflicts?.length ? `<div class="tk-question"><b>Tensions the AI identified</b>${rec.conflicts.map(c=>`<p>${esc(cards.find(n=>n.id===c.a)?.need || c.a)} ↔ ${esc(cards.find(n=>n.id===c.b)?.need || c.b)}: ${esc(c.note)}</p>`).join("")}</div>` : `<p class="tk-caption">No conflict recorded; this does not establish agreement.</p>`}<div class="build-destination"><small>BUILD RESULT</small><p>${esc(d.after || "No build recorded for this step")}</p>${d.before ? `<small>Previously: ${esc(d.before)}</small>` : ""}</div><p class="tk-caption">A proposed response does not mean either person accepted it or the result satisfied the need.</p></div>`;
}
function cardMethods(h,c){
  const line=(h.lines || []).find((l,i)=>(l.i ?? i)===c.line);
  const snapshot=line?.interpretations?.find(r=>r.cards?.some(n=>n.id===c.id));
  const methods=snapshot?.tools || line?.tools || [];
  return methods.length ? `<div class="need-methods"><small>METHODS REPORTED</small>${methods.map(t=>`<p><b>${esc(TOOLKIT_LABELS[t.tool]?.[0] || t.tool)}${t.facilitatorRun ? " · suggested" : ""}</b><small>${esc(t.why || "No reason recorded")}</small></p>`).join("")}</div>` : `<small>No method recorded for this card.</small>`;
}
function understandingBoard(h){
  const w=h.wall || {cards:[]};
  const events=(h.lines || []).flatMap((l,i)=>[
    ...(l.interpretations || []).map(r=>({at:r.at,i,r})),
    ...(l.decisionSnapshot ? [{at:l.decisionSnapshot.at,i,d:l.decisionSnapshot}] : [])
  ]).sort((a,b)=>a.at-b.at || a.i-b.i);
  const latest=[...(h.lines || [])].reverse().find(l=>l.decisionSnapshot)?.decisionSnapshot;
  return `<section class="understanding-wall" aria-label="AI understanding wall"><header><h3>Two people → shared understanding → build</h3><p class="tk-caption">Current need cards, with a separate saved timeline for each new reading and build.</p></header><div class="people-wall">${["A","B"].map(who=>`<section class="person-wall ${who === 'A' ? 'person-a' : 'person-b'}"><h4>${esc(roleName(who))} · needs heard</h4>${w.cards.filter(c=>c.who===who).map(c=>`<article class="need-note${c.withdrawn ? ' withdrawn' : ''}"><small>${esc(c.id)} · ${c.withdrawn ? 'Withdrawn' : c.checked ? 'Clarified by participant' : 'AI interpretation · unconfirmed'}</small><blockquote>${esc(c.quote || 'No source quote recorded')}</blockquote><p>${esc(c.need)}</p>${c.why ? `<small>${esc(c.why)}</small>` : ''}${(c.changes || []).filter(x=>x.status==='pending').map(x=>`<p class="tk-caption">Pending · ${esc(roleName(x.by))}: ${esc(x.change)} (not applied)</p>`).join('')}${cardMethods(h,c)}</article>`).join('') || `<p class="tk-empty">No need cards recorded for this person.</p>`}</section>`).join('')}</div><div class="wall-arrow" aria-hidden="true">↓</div><section class="wall-decisions"><h4>How the AI responded to both people</h4>${decisionDiagram(latest || {cards:w.cards,record:w.record,after:h.standing})}${!latest && h.lines?.length ? '<p class="tk-caption">Current saved record only. A historical build snapshot is unavailable.</p>' : ''}</section><details class="every" data-fold="step-timeline"><summary>Step-by-step history · ${events.length} saved steps</summary><div class="step-timeline">${events.map((e,n)=>`<details class="timeline-step" data-fold="timeline-${esc(h.room || '')}-${e.i}-${e.r?.version || 'build'}"><summary><span class="step-number">${n+1}</span> ${e.r ? `${esc(roleName(e.r.who))} · AI reading · v${esc(e.r.version)}` : 'AI · build decision'}</summary>${e.r ? `<blockquote>${esc(e.r.source)}</blockquote>${readingSnapshot(e.r)}` : decisionDiagram(e.d)}</details>`).join('') || '<p class="tk-empty">No step snapshots in this record. New contributions will save them; old steps are not reconstructed.</p>'}</div></details></section>`;
}

// The control agent's trace: the same lines, the keys-only reading, and what
// that agent said and built beside the toolkit — the room's baseline.
function controlColumn(h, tabs){
  const c = h.control, byAfter = {};
  for (const l of c.lines) if (l.afterLine != null) (byAfter[l.afterLine] ||= []).push(l);
  const rows = [];
  h.lines.forEach(l => {
    if (l.who === "builder" || (h.open && l.phase === "confer")) return;
    const dids = byAfter[l.i] || [];
    rows.push(`<div class="act${dids.length ? "" : " none"} ${l.who === "A" ? "fa" : "fb"}">
      <span class="stamp">${esc(roleName(l.who))} ${l.upload ? "showed" : l.decision ? "confirmed" : "said"}</span>
      <p class="quote">${l.upload ? "their drawing" : esc((l.text || "").slice(0, 120)) + ((l.text || "").length > 120 ? "…" : "")}</p>
      ${l.keysRead ? `<p class="read"><span class="lbl">interpreted as</span>${[...l.keysRead.asks, ...l.keysRead.refuses.map(k => "not: " + k)].map(k => `<span class="key">${esc(k)}</span>`).join("") || `<span class="key none">nothing it could build from</span>`}</p>`
        : l.taken ? "" : `<p class="move muted">This line was never given to it.</p>`}
      ${dids.map(d => d.failed ? `<p class="move muted">It laid something and would not say why.</p>`

    <h2>What the agent did</h2>
    ${tabs}
    <p class="muted" style="font-size:13.5px; margin:-2px 0 14px">The control agent: each line read into keys alone, as in every recorded session, and what it said and built from that — beside the Toolkit, from the same words.</p>

    ${c.standing ? `<p class="made" style="margin-top:6px">stands (control): ${esc(c.standing)}</p>` : ""}</div>`;
}

// The wall, the decision record, the sheet and the retrospectives — inside the
// Toolkit tab, below the line-by-line trace.
function wallInside(h){
  const w = h.wall; if (!w) return "";
  const rec = w.record, byId = Object.fromEntries(w.cards.map(c => [c.id, c]));
  const retro = h.retro || {};
  return `<div class="wrec" style="margin-top:0; border-top:0; padding-top:0"><p class="eyebrow" style="margin-bottom:2px">The wall — every need, whose, and how it came out</p>
    ${w.cards.length ? wallCards(w, false) : `<p class="muted">Nothing on the wall yet.</p>`}
    ${rec && rec.decisions.length ? `<details class="every" style="margin-top:10px"><summary>What it decided about each</summary><ul style="margin:8px 0 0; padding-left:18px; font-size:13px">${rec.decisions.map(d =>
        `<li><b>${esc(byId[d.id]?.need || d.id)}</b> → ${esc(d.response)}: ${esc(d.what)}${d.uncertainty ? ` <span class="muted">— unsure: ${esc(d.uncertainty)}</span>` : ""}</li>`).join("")}</ul>
      ${rec.conflicts.length ? `<p style="margin:8px 0 0; font-size:13px"><b>Conflicts:</b> ${rec.conflicts.map(c => `${esc(byId[c.a]?.need || c.a)} × ${esc(byId[c.b]?.need || c.b)} — ${esc(c.note)}`).join("; ")}</p>` : ""}</details>` : ""}</div>

}

// Whose meaning it acted on. An agent with one principal never needs this;
// with two it is the only thing worth knowing — every property of what stands,
// and which of them asked for it, or whether nobody did.
function attribution(h){
  const f = h.provenance || [];
  if (!f.length) return "";
  const tag = x => x.byA && x.byB ? ["both", "bo"] : x.byA ? ["Role 1", "ra"]
                 : x.byB ? ["Role 2", "rb"] : ["neither of them", "no"];
  const unasked = f.filter(x => !x.byA && !x.byB).length;
  return `<div class="attr">
    <p class="eyebrow">Where it came from</p>
    <ul>${f.map(x => { const [who, cls] = tag(x);
      return `<li><span class="src ${cls}">${esc(who)}</span><span>${esc(x.description)}</span></li>`;
    }).join("")}</ul>
    ${unasked ? `<p class="note">${unasked} of ${f.length} ${unasked === 1 ? "was" : "were"} never asked for by either of them.</p>` : ""}
  </div>`;
}

// The AI draws the crossing from the words alone — no keys, no kit — so the desk
// can put its two reconstructions side by side: the one the workshop could hold,
// and the one the words carried. Facilitator only, and on request, because each
// drawing is an image-model call.
function sketchPanel(h){
  const ks = h.sketches || [], last = ks[ks.length - 1];
  const said = h.lines.filter(l => l.who !== "builder" && !l.upload && l.text).length;
  const fromRefs = last?.source === "reference assets";
  const canDraw = said > 0 || h.lines.some(l=>l.upload);
  const stale = !fromRefs && last && said > last.lines;
  return `<div class="sketch" role="tabpanel" aria-label="Line sketch">
    <div>${last
      ? `<img src="/sketch/${esc(h.room)}/${last.n}.png" alt="${fromRefs ? 'Bridge line sketch reconstructed from the saved reference images' : 'Bridge line sketch drawn from the saved conversation'}">`
      : `<div class="empty">${h.sketching ? "Drawing from what they said…" : "No line sketch saved for this conversation yet."}</div>`}</div>
    <div>
      ${h.archived && !last ? `<p class="note">This historical record has no saved sketch.</p>` : ""}
      <p class="eyebrow">${fromRefs ? (last?.retrospective ? "Generated later from saved reference images" : "Drawn from the submitted reference images") : last?.retrospective ? "Generated later from the saved conversation" : "Sketched from the chat alone"}</p>
      <p class="what ${last ? "" : "none"}">${last ? `Drawn from ${fromRefs ? `${last.references} reference image${last.references===1?"":"s"}` : `${last.lines} line${last.lines === 1 ? "" : "s"}`}${ks.length > 1 ? ` · sketch ${last.n} of ${ks.length}` : ""}` : "nothing drawn yet"}</p>
      ${h.sketchError ? `<p class="note" style="color:#f2b8a6"><b>Could not draw it:</b> ${esc(h.sketchError)}</p>` : ""}
      <p class="note">This sketch is a separate drawing from ${fromRefs ? "the saved reference images and recorded AI outcome" : "the conversation"}, not a tracing of the matchstick bridge.${stale ? ` <b>${said - last.lines} more line${said - last.lines === 1 ? " has" : "s have"} been said since this was drawn.</b>` : ""}</p>
      ${h.archived || h.finished === undefined || h.role !== "host" || !document.getElementById || location.pathname.startsWith("/history") ? "" : `<div class="row">
        <button class="go" id="sketch" ${h.sketching || !canDraw ? "disabled" : ""}>${h.sketching ? "Drawing…" : last ? "Generate another sketch" : "Generate line sketch"}</button>
        ${ks.length > 1 ? ks.slice(0, -1).map(k => `<a class="mini" href="/sketch/${esc(h.room)}/${k.n}.png" target="_blank" rel="noopener">sketch ${k.n}</a>`).join("") : ""}
      </div>`}
    </div>
  </div>`;
}

let activeSeat = "B";
let studyMode = "collaborate";
const feedbackFrames = new Map();
function integratedFeedback(h){
  app.classList.toggle("feedback-mode",studyMode === "feedback");
  let host=document.getElementById("integrated-feedback");
  if(!host){host=document.createElement("div");host.id="integrated-feedback";app.after(host);}
  host.hidden=studyMode!=="feedback";
  for(const frame of feedbackFrames.values())frame.hidden=true;
  if(host.hidden)return;
  const variant=h.control&&bridgeTab==="control"?"control":"main";
  const key=h.room+":"+variant;
  let frame=feedbackFrames.get(key);
  if(!frame){
    frame=document.createElement("iframe");frame.title="Visual feedback for this pair and conversation";
    frame.src=`./feedback.html?room=${encodeURIComponent(h.room)}&embedded=1&role=${activeSeat}${variant==='control'?'&variant=control':''}`;
    feedbackFrames.set(key,frame);host.append(frame);
  }
  frame.hidden=false;
}

const studioScroll = {};
const studioFolds = new Set();
app.addEventListener("toggle", e => {

}, true);
function restoreStudioFolds(){
  app.querySelectorAll("details[data-fold]").forEach(el => { el.open = studioFolds.has(el.dataset.fold); });
}
function studioFocus(){

  return el && app.contains(el) && el.tagName === "TEXTAREA" ? {id:el.id,start:el.selectionStart,end:el.selectionEnd} : null;
}
function restoreStudioFocus(f){

  if (el && !el.disabled) { el.focus({preventScroll:true}); el.setSelectionRange(f.start,f.end); }
}
function bothView(){
  const a = both.A, b = both.B, h = both.host;
  if (!a || !b || !h) return;
  last.A = a; last.B = b;
  if (setupRoom !== a.room) { setupRoom = a.room; setupDraft = null; studioFolds.add("research"); if(a.route === "only-1") activeSeat="A"; if(a.route === "only-2") activeSeat="B"; }
  app.classList.add("wide");
  const focus = studioFocus();

/* ── live ──────────────────────────────────────────────────────────────── */
// Three ways in, because a proxy can hold a live stream back. Through a
// Cloudflare tunnel the event stream opened and then delivered nothing at all
// for as long as anybody waited, so a page that only painted on the stream's
// first message stayed blank. It paints from a plain request first, which
// proxies pass straight through; takes the stream when the stream flows; and
// polls when it does not.
function listen(room, role, onState){
  let last = "", streamed = false, stopped = false, es = null;
  // Only repaint on a real change. Repainting on every poll rebuilt the
  // composer every two seconds and would have thrown away half a sentence.
  // A room that is gone used to be skipped in silence, which left the page
  // blank for good. Say so instead.
  const apply = s => {
    // A room left behind by a tab switch must not paint over the new one.
    if (stopped) return;
    if (s && s.error) { gone(room); return; }
    if (!s) return;
    const k = JSON.stringify(s);
    if (k === last) return;
    last = k; onState(s);
  };
  const pull = () => fetch(`/api/state?room=${room}&role=${role}`)
    .then(r => r.json()).then(apply).catch(() => {});
  pull();
  try {
    es = new EventSource(`/events?room=${room}&role=${role}`);
    es.onmessage = e => { streamed = true; apply(JSON.parse(e.data)); };
  } catch {}
  const timer = setInterval(() => { if (!streamed) pull(); }, 2000);
  return () => { stopped = true; clearInterval(timer); if (es) es.close(); };
}

// Painted once. Polling keeps hearing that the room is gone, and repainting on
// every poll would throw away whatever the facilitator had just picked.
function gone(room){
  if (app.dataset.gone === room) return;
  app.dataset.gone = room;
  app.classList.remove("wide");
  if (ROLE !== "both" || !opts) {
    app.innerHTML = `<div class="card"><h2>That room is gone</h2>
      <p class="muted">Room ${esc(room)} no longer exists — rooms do not survive the server
      restarting. Ask for a fresh link.</p></div>`;
    return;
  }
  // The facilitator's link should never be a dead end: pick again, get a room.
  const pick = { argument: opts.arguments[0].id, route: "all", wall: false };
  const paint = () => {
    app.innerHTML = `
      <div>
        <p class="eyebrow">Room ${esc(room)} is gone</p>
        <h1>Open a new room</h1>
        <p class="lede">Rooms do not survive the server restarting. Pick a use case and how their words
          travel, and you get a fresh room with a link for each role.</p>
      </div>
      ${filterBar(pick)}
      <div class="row"><button class="go" id="open">Open this room</button></div>`;
    app.querySelectorAll("[data-fa]").forEach(x => x.onclick = () => { pick.argument = x.dataset.fa; paint(); });
    app.querySelectorAll("[data-fr]").forEach(x => x.onclick = () => { pick.route = x.dataset.fr; paint(); });
    document.getElementById("open").onclick = () => openRoom(pick.argument, pick.route, pick.wall);
  };
  paint();
}

// Switching tabs. Each click used to open a room and reload the page at once,
// which through the tunnel takes a second or two with nothing on screen to say
// it was happening — so people clicked again, and that click was either lost in
// the reload or paired with the old choice (a new route on the old use case).
// Now a click shows at once, the picking can go on, and one room is opened for
// wherever the picking ends up.
let picking = null;
function choose(base, change) {
  picking = { ...(picking || base), ...change };
  for (const x of app.querySelectorAll("[data-fa]")) x.setAttribute("aria-pressed", String(x.dataset.fa === picking.argument));
  for (const x of app.querySelectorAll("[data-fr]")) x.setAttribute("aria-pressed", String(x.dataset.fr === picking.route));
  const note = document.getElementById("switching");
  if (note) { note.hidden = false; note.textContent = "Opening a new room…"; }
  document.querySelector(".filters")?.classList.add("busy");
  clearTimeout(choose.timer);
  choose.timer = setTimeout(() => openRoom(picking.argument, picking.route, picking.wall), 500);
}

async function openRoom(argument, route, wall, agent = "toolkit"){
  // One room at a time. A pick made while one is being opened is not dropped:
  // when it comes back, if the choice has moved on, open the latest instead.
  if (openRoom.busy) return;
  openRoom.busy = true;
  let want = { argument, route, wall: !!wall, agent };
  for (;;) {
    const { ok, j } = await post("/api/create", want)
      .catch(() => ({ ok: false, j: {} }));
    if (!ok) {
      openRoom.busy = false; picking = null;
      const note = document.getElementById("switching");
      if (note) { note.hidden = false; note.textContent = "Could not open a new room. Your current conversation is kept; please try again."; }
      document.querySelector(".filters")?.classList.remove("busy");
      return;
    }
    const latest = picking || want;
    if (latest.argument === want.argument && latest.route === want.route && !!latest.wall === want.wall) {
      picking = null; openRoom.busy = false;
      history.pushState(null, "", `/j/${j.room}/both`);
      delete app.dataset.gone;
      watchBoth(j.room);
      return;
    }
    want = { argument: latest.argument, route: latest.route, wall: !!latest.wall, agent: latest.agent || agent };
  }
}

function joinView(room){

    if (s.error) { app.innerHTML = `<div class="card"><h2>That room is gone</h2>

  function select(i){buttons.forEach((button,j)=>{button.setAttribute('aria-selected',String(i===j));button.tabIndex=i===j?0:-1;panels[j].hidden=i!==j;});}
  card.append(tabs,...panels);select(0);
  const footer=make('details',undefined,'fh-data'),summary=make('summary','Receipt & raw data'),meta=make('p',`Room ${record.room} · Receipt ${record.id}`,'fh-muted'),raw=make('pre',JSON.stringify({ratings:d.ratings,removed:d.removed,added:d.added,annotations:d.annotations},null,2));footer.append(summary,meta,raw);card.append(footer);target.append(card);
 }
}

// One past session, read back from its record: the same trace, drawing and
// attribution as the live page, with nothing left to type into.
async function historyView(id){
  const rec = await fetch(`/api/export?room=${id}&format=json`)
    .then(r => r.ok ? r.json() : null).catch(() => null);
  if (!rec) {
    app.innerHTML = `<div class="card"><h2>Nothing saved for room ${esc(id)}</h2>
      <p class="muted">A session is kept from the first line anybody sends. <a href="/history">Back to history</a></p></div>`;
    return;
  }
  const h = { agent:rec.agent || "both", room: rec.room, role: "host", title: rec.title, arrow: rec.arrow, finished: rec.finished,
    lines: rec.transcript.map((l,i)=>({...l,i})), standing: rec.standing, shape: rec.shape, world: rec.world || {},
    provenance: rec.provenance, score: rec.score, thinking: false, sketches: rec.sketches || [],
    wall: rec.wall || null, retro: rec.retro || {},
    control: rec.control ? { standing: rec.control.standing, shape: rec.control.shape, world: rec.control.world || {}, provenance: null, lines: rec.control.lines || [], score: rec.control.score || null } : null,
    sheetDrawn: rec.sheetDrawn || null };
  const when = t => t ? new Date(t).toLocaleString([], { dateStyle: "full", timeStyle: "short" }) : "";
  app.classList.add("wide");
  app.innerHTML = `
    <div>
      <p class="eyebrow"><a href="/history">← History</a> · room ${esc(rec.room)}</p>
      <h1>${(rec.feedback||[]).length?'Feedback review':esc(rec.title)}</h1>
      <p class="lede">${esc(rec.title)} · ${esc(rec.arrow)}<br><span class="fh-muted">Experiment recorded ${esc(when(rec.createdAt))}</span></p>
    </div>
    <section class="card fh-section" id="submitted-feedback"><p class="fh-kicker">PARTICIPANT FEEDBACK</p><h2>Submitted results</h2><p class="fh-muted">${(rec.feedback||[]).length} saved submission${(rec.feedback||[]).length===1?'':'s'} · Select a step to review its image and feedback.</p><div id="feedback-records"></div></section>
    <details class="card fh-context" ${(rec.feedback||[]).length?'':'open'}><summary>Original experiment · conversation, AI process & result</summary>
    <div class="card goals">
      ${["A","B"].map(r => `<p><b>${roleName(r)}</b> ${esc(rec.goals[r])}</p>`).join("")}
    </div>
    <div class="desk">
      <div class="card tab"><h2>What they said</h2>${conversation(h, "hist-chat", true, "chat")}</div>
      ${builderColumn(h)}
    </div>
    ${resultBar(h)}
    </details>`;
  renderHistoryFeedback(document.getElementById("feedback-records"),rec.feedback||[]);

  const cv = document.getElementById("crossing");
  const shown = h.control && bridgeTab === "control" ? h.control : h;
  if (cv && window.drawCrossing) drawCrossing(cv, shown.shape, shown.world, shown === h ? h.sheetDrawn : null);
  app.querySelectorAll("[data-atab]").forEach(t => t.onclick = () => { agentTab = t.dataset.atab; historyView(id); });
  app.querySelectorAll("[data-btab]").forEach(t => t.onclick = () => { bridgeTab = t.dataset.btab; historyView(id); });
  app.querySelectorAll("[data-output]").forEach(t=>t.onclick=()=>{outputTabs.set(h.room,t.dataset.output);historyView(id);});
}

// Public pages may outlive a temporary tunnel. Resolve History through the
// stable GitHub entry point; keep local navigation local.
document.addEventListener('click',e=>{
 const a=e.target.closest('a[href]');
 if(!a||!location.hostname.endsWith('.trycloudflare.com'))return;
 const u=new URL(a.href,location.href);
 if(u.origin===location.origin&&/^\/history(?:\/[a-z0-9]+)?$/.test(u.pathname))a.href='https://vividadiva.github.io/two-worlds-bridge/live.html#'+u.pathname+u.search+u.hash;
},true);
(async () => {
  // The way back to the history, on every page the facilitator uses. Never on a
  // participant's own seat or the join screen: the history shows what the
  // builder read off each of them.
  if (!(ROOM && ROLE !== "both")) {
    const nav = document.getElementById("topnav");
    nav.hidden = false;
    const here = location.pathname.startsWith("/history") || location.pathname === "/sessions" ? "/history" : "";
    for (const a of nav.querySelectorAll("a")) if (a.getAttribute("href") === here) a.setAttribute("aria-current", "page");
  }
  if (location.pathname === "/sessions" || location.pathname === "/history") {
    window.onhashchange = () => sessionsView();
    return sessionsView();
  }
  const past = /^\/history\/([a-z0-9]+)$/.exec(location.pathname);
  if (past) return historyView(past[1]);
  const q = new URLSearchParams(location.search).get("room");
  // Opened the bare link, but this browser has already taken a side here.
  if (ROOM && !ROLE) {
    let mine = null;
    try { mine = localStorage.getItem("side-" + ROOM); } catch {}
    if (mine === "A" || mine === "B") { location.replace(`/j/${ROOM}/${mine}`); return; }
    return joinView(ROOM);
  }
  if (ROOM && ROLE === "both") {
    // Three streams. A and B carry each person's own goal, turn and composer;
    // host is the only one that carries every line, what stands, and the score,
    // which is what the builder column and the bar along the bottom are drawn
    // from. The options are needed before the first paint or the filters across
    // the top have nothing to draw.
    opts = await fetch("/api/options").then(r => r.json());
    users=await fetch("/api/users").then(r=>r.json());
    const owner=users.find(u=>u.sessions.some(x=>x.room===ROOM));
    let remembered; try{remembered=localStorage.getItem("bridge-user");}catch{}
    selectedUser=owner?.id || users.find(u=>u.id===remembered)?.id || "user2";
    selectedProcess=owner?.sessions.find(x=>x.room===ROOM)?.agent || "keys";
    userNav();
    if(owner)watchBoth(ROOM);
    else await switchProcess(selectedProcess,"pairs");
    // Rooms are switched in place, so Back has to be handled here: go to the
    // room the address now names.
    window.onpopstate = () => location.reload();
  } else if (ROOM) {
    listen(ROOM, ROLE, s => playerView(s));
  } else if (q) {
    opts = opts || await fetch("/api/options").then(r => r.json()).catch(() => null);
    listen(q, "host", s => hostView(s));
  } else {
    opts=await fetch("/api/options").then(r=>r.json());
    users=await fetch("/api/users").then(r=>r.json());
    let remembered;try{remembered=localStorage.getItem("bridge-user");}catch{}
    selectedUser=users.find(u=>u.id===remembered)?.id || "user2";
    userNav(); await switchProcess("keys","pairs");
    window.onpopstate=()=>location.reload();
  }
})().catch(showStudyError);
})().catch(showStudyError);
function showStudyError(error){const app=document.getElementById("app");app.replaceChildren();const title=document.createElement("h1"),message=document.createElement("p"),retry=document.createElement("button");title.textContent="Study connection unavailable";message.textContent="The page is hosted on GitHub. The study server could not be reached. Previously saved records have not been deleted.";retry.textContent="Try again";retry.onclick=()=>window.location.reload();app.append(title,message,retry);console.error(error);}
</script>
